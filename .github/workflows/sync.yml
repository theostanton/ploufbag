name: Sync Strava

# Manual only. This re-reads a pilot's Strava history and, unless it is a dry
# run, creates flights and publishes statistics into their Strava descriptions.
# Not something that should happen because somebody pushed a branch.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: 'Strava athlete id to sync.'
        required: true
        type: string
      dry_run:
        description: 'Scan and report only: promote nothing, write nothing to Strava.'
        required: false
        type: boolean
        default: false

# Never two syncs at once: they would race for the same rows and burn the same
# Strava rate limit twice. Queue rather than cancel -- a half-finished sync is
# not harmful, but killing one mid-promotion wastes the requests it spent.
concurrency:
  group: sync-strava
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The deployed tasks service, which is where the logic runs. This workflow
  # dispatches and nothing else. Running the scan in the runner instead would
  # mean a second execution environment -- executing source from whatever branch
  # was dispatched rather than the bundle that is deployed -- and holding the
  # production database password in CI to do it.
  TASKS_URL: https://tasks.ploufbag.com
  # How many times to come back for the rest. A round is bounded twice over: by
  # the promotion batch, and by a time budget the task stops itself on so that
  # Cloud Run never kills it mid-write and returns a 504 with no summary at all.
  # A backlog therefore takes several runs, and `remaining` in the response says
  # when to stop. The cap only guards against looping for ever on a task that
  # always reports work left.
  MAX_ROUNDS: 12

jobs:
  sync:
    name: Re-read Strava
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # An identity token for the tasks service, minted from the same workload
      # identity credentials the deploy uses. The service currently allows
      # unauthenticated callers, so this is not required yet; it is here so that
      # locking that down does not also break this workflow.
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: https://tasks.ploufbag.com
          id_token_include_email: true

      - name: Sync
        env:
          # Through the environment rather than interpolated into the script. A
          # dispatch input pasted into a command line is a command injection,
          # however trusted whoever presses the button is.
          PILOT: ${{ inputs.pilot }}
          DRY_RUN: ${{ inputs.dry_run }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        # The default shell here is `bash -e {0}`: no `-o pipefail`, so in a
        # pipeline only the last command's status is seen and a jq that fails
        # mid-pipe reads as success. Set it explicitly rather than write around
        # it.
        shell: bash -euo pipefail {0}
        run: |
          case "$PILOT" in
            ''|*[!0-9]*)
              echo "::error::Pilot must be a Strava athlete id, got '$PILOT'."
              exit 1
              ;;
          esac

          dry_run=false
          if [ "$DRY_RUN" = "true" ]; then
            dry_run=true
          fi

          body="$(jq -nc \
            --argjson pilotId "$PILOT" \
            --argjson dryRun "$dry_run" \
            '{name: "FetchAllActivities", pilotId: $pilotId, dryRun: $dryRun}')"

          echo "### Sync for pilot $PILOT" >> "$GITHUB_STEP_SUMMARY"

          for round in $(seq 1 "$MAX_ROUNDS"); do
            response="$(curl -sS -X POST "$TASKS_URL" \
              -H "Authorization: Bearer $ID_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              -w $'\n%{http_code}')"

            status="$(tail -n1 <<<"$response")"
            payload="$(sed '$d' <<<"$response")"

            if [ "$status" != "200" ]; then
              echo "::error::Task returned HTTP $status: $(jq -r '.message // .' <<<"$payload" 2>/dev/null || echo "$payload")"
              exit 1
            fi

            jq -r --arg round "$round" '
              .summary
              | if . == null then "round \($round): no summary returned"
                else "round \($round): scanned \(.scanned), \(.flight) flights, \(.unsure) unsure"
                     + (if .reviewed > 0 then ", reviewed \(.reviewed) (\(.reconsidered) changed)" else "" end)
                     + ", +\(.promoted) imported, -\(.demoted) removed, \(.remaining) left"
                     + (if (.attributed // 0) > 0
                        then ", \(.attributed) wings recovered from descriptions"
                        else "" end)
                     + (if (.wingsCreated // 0) > 0
                        then " (\(.wingsCreated) new)"
                        else "" end)
                     + (if (.republished // 0) > 0
                        then ", \(.republished) descriptions published"
                        else "" end)
                     + (if (.remaining // 0) > 0
                        then " (\(.remaining) still to do)"
                        else "" end)
                     + (if ((.undescribed // 0) + (.unpublishable // 0)) > 0
                        then " — ⚠️ \((.undescribed // 0) + (.unpublishable // 0)) got no Strava description"
                        else "" end)
                     + (if (.nothingToPublish // 0) > 0
                        then " — ⚠️ \(.nothingToPublish) had nothing to publish and will come back next round"
                        else "" end)
                     + (if (.unattributable // 0) > 0
                        then " — ⚠️ \(.unattributable) named a wing we could not store and will come back next round"
                        else "" end)
                     + (if .timedOut then " (stopped on its time budget)" else "" end)
                end
            ' <<<"$payload" | tee -a "$GITHUB_STEP_SUMMARY"

            if [ "$(jq -r '.summary.rateLimited // false' <<<"$payload")" = "true" ]; then
              echo "Paused on Strava's rate limit. Run this again in fifteen minutes to continue." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$(jq -r '.summary.remaining // 0' <<<"$payload")" -le 0 ]; then
              echo "Nothing left to import." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          echo "::warning::Still reporting work left after $MAX_ROUNDS rounds; run it again."
