version: "3"

tasks:
  # buildProd's copyCommon step copies ../common/dist verbatim without building
  # it, so a stale common/dist silently ships old code. Under auto-apply that
  # happens with nobody watching, so build common first.
  build-common:
    desc: Build the common package
    internal: true
    dir: common
    sources:
      - src/**/*.ts
      - exclude: src/**/*.test.ts
    generates:
      - ./dist/**
    cmds:
      - yarn build

  build:
    desc: Build the functions
    dir: functions
    deps: [ build-common ]
    sources:
      - src/**/*.ts
      - exclude: src/**/*.test.ts
      - ../common/dist/**
    generates:
      - ./dist/
    cmds:
      - rm -rf ./dist/*
      # buildProd already runs updateProdPackage, which is this same copy.
      - yarn buildProd

  webhooks:logs:
    desc: View webhooks logs
    cmds:
      - open "https://console.cloud.google.com/run/detail/europe-west1/webhooks/logs?project=para-stats"

  tasks:logs:
    desc: View tasks logs
    cmds:
      - open "https://console.cloud.google.com/run/detail/europe-west1/tasks/logs?project=para-stats"

  api:logs:
    desc: View api logs
    cmds:
      - open "https://console.cloud.google.com/run/detail/europe-west1/api/logs?project=para-stats"

  tasks:tail:
    desc: Tail tasks logs in terminal
    cmds:
      - gcloud logging tail "resource.type=cloud_run_revision AND resource.labels.service_name=tasks" --project=para-stats