version: "3"

tasks:

  build:
    desc: Build the image
    internal: true
    cmds:
      - |
        docker build -f site/prod.Dockerfile \
        -t europe-west1-docker.pkg.dev/para-stats/parastats/parastats-site:{{.TAG}} \
        --platform linux/amd64 \
        --build-arg NEXT_PUBLIC_MAPBOX_TOKEN={{.NEXT_PUBLIC_MAPBOX_TOKEN}} \
        .

  push:
    desc: Push the image
    internal: true
    dir: site
    requires:
      vars: [ TAG ]
    cmds:
      - docker push europe-west1-docker.pkg.dev/para-stats/parastats/parastats-site:{{.TAG}}

  deploy:
    desc: Deploy site image
    # TAG defaults here so `task site:deploy` still works standalone, but the
    # root `deploy` task passes one in so the same tag reaches infra:apply.
    vars:
      TAG: '{{.TAG | default (now | unixEpoch)}}'
    cmds:
      - task: build
        vars:
          TAG:
            ref: .TAG
      - task: push
        vars:
          TAG:
            ref: .TAG
